<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scale=no" />
    <link rel="stylesheet" href="style.css" />
    <title>Platos</title>
  </head>
  <body>
    <!-- Barra superior (mobile-first) -->
    <header> 
      <button class="back-btn" onclick="location.href='index.html'">
        <img src="img/back-btn.png" alt="Atrás">
      </button>
      <button class="home-btn" onclick="location.href='index.html'">
        <img src="img/home.png" alt="Atrás">
      </button>
      <h1>PLATOS</h1> 
    </header>
    <main class="mainContent">
      <a class="enlace" href="entrantesYEnsaladas.html">
          <section class="cards">
            <img class="imageCards" src="img/ensaladas.png" alt="Entrantes y Ensaladas">    
            <div class="cardsText">
              <h2>Entrantes y Ensaladas</h2> 
              <P>Con vegetales frescos</P>
            </div> 
          </section>
      </a>
    <hr class="separación">  
          <section class="cards">
            <img class="imageCards" src="img/carne.png" alt="Carnes y Parrilladas">    
              <div class="cardsText">
                <h2>Carnes y Parrilla</h2> 
                <P>Con patatas asadas y salsa</P>
              </div>    
          </section>
    <hr class="separación">
          <section class="cards">
            <img class="imageCards" src="img/hamburguesa.png" alt="Hamburguesas a la parrilla">    
              <div class="cardsText">
                <h2>Hamburguesas</h2> 
                <P>A la parrilla con patatas, vegetales frescos y salsa</P>
              </div>    
          </section>
    <hr class="separación">
          <section class="cards">
            <img class="imageCards" src="img/pescados.png" alt="Pescados y Mariscos">    
              <div class="cardsText">
                <h2>Pescados y Mariscos</h2> 
                <P>Trozos de pescado rebozado, con ensalada y salsas</P>
              </div> 
          </section>
    <hr class="separación">  
          <section class="cards">
            <img class="imageCards" src="img/comidaPeruana.png" alt="Gastronomía Peruana">    
              <div class="cardsText">
                <h2>Gastronomia peruana</h2> 
                <P>Patlos tipicos con sabor auténtico</P>
              </div> 
          </section>  
    </main>  
  </body>
</html>
