name: Publicar demo de El Abrazsador desde main
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-carta-demo.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-demo
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-demo
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar solo la rama aislada de demostración
        uses: actions/checkout@v4
        with:
          ref: gh-pages-demo
          path: preview-site
          persist-credentials: false
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaquetar la demostración
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-attempt-${{ github.run_attempt }}
          path: preview-site
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-attempt-${{ github.run_attempt }}
      - name: Comprobar enlace público y catálogo real
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://rheeggan.github.io/carta-online-restaurante-main"
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$BASE/" -o /tmp/demo-index.html \
                && grep -q 'DEMOSTRACIÓN' /tmp/demo-index.html \
                && curl -fsSL --max-time 15 "$BASE/menu.json" -o /tmp/demo-menu.json \
                && python -c 'import json; d=json.load(open("/tmp/demo-menu.json")); assert len(d["products"]) == 81 and len(d["categories"]) == 15' \
                && curl -fsSL --max-time 15 "$BASE/app.js" -o /tmp/demo-app.js \
                && grep -q 'const isEvaluation=false' /tmp/demo-app.js; then
              echo "PUBLIC_SITE_VERIFIED $BASE/"
              echo "PRODUCTS=81 CATEGORIES=15 EVALUATION_DISABLED=true"
              exit 0
            fi
            echo "Site verification pending, attempt $i"
            sleep 3
          done
          echo "::error::La URL pública todavía no sirve la demo esperada"
          exit 1
